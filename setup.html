<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nyoura Assistant — Settings</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1e1e1e; color: #eee; margin: 0;
            padding: 28px 26px; user-select: none;
        }
        h1 { font-size: 19px; margin: 0 0 6px 0; }
        .sub { font-size: 13px; color: #888; margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: #bbb;
                margin-top: 16px; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; background: #2a2a2a;
                border: 1px solid #444; color: #eee; border-radius: 4px;
                font-size: 14px; font-family: inherit; }
        input:focus { outline: none; border-color: #4a9eff; }
        .hint { font-size: 12px; color: #777; margin-top: 6px; line-height: 1.4; }
        .link { color: #4a9eff; cursor: pointer; text-decoration: none; }
        .link:hover { text-decoration: underline; }
        .row { display: flex; gap: 8px; margin-top: 26px; }
        button { flex: 1; padding: 11px; border: none; border-radius: 4px;
                 font-size: 14px; font-weight: 600; cursor: pointer;
                 font-family: inherit; }
        #save-btn { background: #4a9eff; color: white; }
        #save-btn:hover:not(:disabled) { background: #3a8eef; }
        #save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #cancel-btn { background: #333; color: #bbb; flex: 0 0 100px; }
        #cancel-btn:hover { background: #3d3d3d; color: #eee; }
        .error { color: #ff6b6b; font-size: 13px; margin-top: 12px; min-height: 18px; }
        .ok { color: #4caf50; font-size: 13px; margin-top: 12px; }
        .hint-strong { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <h1 id="title">Nyoura Assistant — Setup</h1>
    <div class="sub" id="subtitle">One-time setup. Takes about a minute.</div>

    <label for="apiKey">Gemini API Key <span style="color:#ff6b6b">*</span></label>
    <input id="apiKey" type="password" placeholder="AIzaSy..." autocomplete="off" spellcheck="false" />
    <div class="hint" id="key-hint">
        Don't have one? Get a free key at
        <a class="link" id="get-key-link">aistudio.google.com/app/apikey</a>
    </div>

    <label for="proxy">SOCKS5 Proxy <span style="color:#777">(optional)</span></label>
    <input id="proxy" type="text" placeholder="socks5://127.0.0.1:1080" autocomplete="off" spellcheck="false" />
    <div class="hint">
        Only needed if your network requires a proxy (corporate networks,
        restricted Wi-Fi, or your own proxy server). Leave empty to connect directly.
    </div>

    <div class="row">
        <button id="save-btn">Save</button>
        <button id="cancel-btn">Cancel</button>
    </div>
    <div id="msg" class="error"></div>

    <script src="./setup.js"></script>
</body>
</html>
